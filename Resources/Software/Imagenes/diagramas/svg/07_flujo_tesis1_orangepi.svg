l="#0F172A" text-anchor="middle">y hay un último</text><text x="220" y="662.2456000000001" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">comando?</text><path d="M220,528 L220,575" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m475569)" opacity="1"/><rect x="71.5" y="757.5" width="300" height="70" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="70.0" y="755.0" width="300" height="70" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5" opacity="1"/><text x="220" y="785.3356" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Reenviar el último comando</text><text x="220" y="803.2755999999999" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">retención: 20 × 50 ms = 1 s</text><path d="M220,705 L220,755" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m475569)" opacity="1"/><rect x="71.5" y="861.5" width="300" height="92" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="70.0" y="859.0" width="300" height="92" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5" opacity="1"/><text x="220" y="891.3656000000001" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Ciclo 21: dejar de escribir</text><text x="220" y="909.3056000000001" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">aviso en consola; el Pico</text><text x="220" y="927.2456000000001" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">entra solo en failsafe (500 ms)</text><path d="M385,640 L422.0,640.0 Q430,640 430.0,648.0 L430.0,897.0 Q430,905 422.0,905.0 L370,905" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m475569)" opacity="1"/><path d="M70,790 L48.0,790.0 Q40,790 40.0,782.0 L40.0,403.0 Q40,395 48.0,395.0 L552,395" fill="no