<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" font-family="Inter, 'DejaVu Sans', sans-serif"><defs><marker id="m475569" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="48" y="58" font-size="26" font-weight="700" fill="#0F172A">Flujo de tesis1.py (Orange Pi 4 Pro)</text><text x="48" y="86" font-size="15" fill="#475569">Puente entre la red y el Pico: recibe UDP, convierte los ejes y escribe 4 bytes por I²C</text><text x="48" y="1226" font-size="12" fill="#94A3B8">Elaboración propia a partir del repositorio github.com/prueba2001/UAV-CONTROLADO-POR-4G-LTE</text><rect x="600.0" y="117.0" width="240" height="46" rx="23.0" fill="#C2410C" stroke="#C2410C" stroke-width="1.5" opacity="1"/><text x="720" y="144.3056" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Inicio · tesis1.py</text><rect x="531.5" y="195.5" width="380" height="54" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="530.0" y="193.0" width="380" height="54" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5" opacity="1"/><text x="720" y="215.3356" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Abrir bus I²C 2</text><text x="720" y="233.2756" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">smbus2.SMBus(2)</text><rect x="531.5" y="280.5" width="380" height="54" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="530.0" y="278.0" width="380" height="54" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5" opacity="1"/><text x="720" y="300.3356" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Abrir socket UDP</text><text x="720" y="318.2756" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">0.0.0.0:5005 · timeout 50 ms</text><polygon points="564.0,368.0 890.0,368.0 876.0,422.0 550.0,422.0" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/><text x="720" y="390.3356" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Esperar paquete</text><text x="720" y="408.2756" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">sock.recvfrom(1024)</text><polygon points="720,453.0 860.0,505 720,557.0 580.0,505" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.7"/><text x="720" y="500.3356" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">¿Llegó un paquete</text><text x="720" y="518.2755999999999" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">en 50 ms?</text><rect x="551.5" y="604.5" width="340" height="46" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="550.0" y="602.0" width="340" height="46" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5" opacity="1"/><text x="720" y="629.3056" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">ciclos_sin_datos = 0</text><rect x="531.5" y="680.5" width="380" height="54" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="530.0" y="678.0" width="380" height="54" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5" opacity="1"/><text x="720" y="700.3356" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Decodificar UTF-8 y separar</text><text x="720" y="718.2755999999999" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">por comas (si falla: ignorar)</text><polygon points="720,762.0 850.0,810 720,858.0 590.0,810" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.7"/><text x="720" y="814.3056" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">¿4 campos?</text><rect x="491.5" y="888.5" width="460" height="98" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="490.0" y="886.0" width="460" height="98" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5" opacity="1"/><text x="720" y="913.265" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Mapear ejes</text><text x="720" y="930.515" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">X2→alabeo · Y2→cabeceo · X1→guiñada</text><text x="720" y="947.765" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">0–1023 → 0–180° (zona muerta ±4°)</text><text x="720" y="965.015" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Y1→gas: solo mitad superior (&gt;532) → 0–100 %</text><rect x="491.5" y="1025.5" width="460" height="54" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="490.0" y="1023.0" width="460" height="54" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5" opacity="1"/><text x="720" y="1045.515" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Escribir en el Pico</text><text x="720" y="1062.765" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">write_i2c_block_data(0x08, 0, [a, c, g, gas])</text><polygon points="720,1105.0 820.0,1150 720,1195.0 620.0,1150" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.7"/><text x="720" y="1154.3056" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">¿ACK?</text><path d="M720,163 L720,193" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m475569)" opacity="1"/><path d="M720,247 L720,278" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m475569)" opacity="1"/><path d="M720,332 L720,368" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m475569)" o