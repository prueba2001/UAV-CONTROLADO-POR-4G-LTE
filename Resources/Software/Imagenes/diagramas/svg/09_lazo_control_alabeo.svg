<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Inter, 'DejaVu Sans', sans-serif"><defs><marker id="m0D9488" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#0D9488"/></marker><marker id="m0F172A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#0F172A"/></marker><marker id="mDB2777" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#DB2777"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="48" y="58" font-size="26" font-weight="700" fill="#0F172A">Lazo de estabilización de alabeo (main1.py)</text><text x="48" y="86" font-size="15" fill="#475569">MPU6050 → filtro complementario → controlador PD → mezcla de alerones → avión, a ~200 Hz</text><text x="48" y="836" font-size="12" fill="#94A3B8">Elaboración propia a partir del repositorio github.com/prueba2001/UAV-CONTROLADO-POR-4G-LTE</text><rect x="51.5" y="252.5" width="170" height="140" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="50" y="250" width="170" height="140" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6" opacity="1"/><text x="135.0" y="297.06800000000004" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">MPU6050</text><text x="135.0" y="315.26800000000003" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">acelerómetro</text><text x="135.0" y="333.468" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">giroscopio</text><text x="135.0" y="351.668" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">I²C1 · 0x68</text><rect x="301.5" y="232.5" width="190" height="70" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="300" y="230" width="190" height="70" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6" opacity="1"/><text x="395.0" y="260.45" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">atan2(ay, az)</text><text x="395.0" y="277.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">inclinación del acel.</text><rect x="301.5" y="342.5" width="190" height="70" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="300" y="340" width="190" height="70" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6" opacity="1"/><text x="395.0" y="370.45" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">gx − sesgo</text><text x="395.0" y="387.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">sesgo: 1 s en reposo</text><rect x="561.5" y="232.5" width="280" height="180" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="560" y="230" width="280" height="180" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6" opacity="1"/><text x="700.0" y="280.45" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">Filtro complementario</text><text x="700.0" y="297.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">roll = 0,995·(roll + tasa·dt)</text><text x="700.0" y="315.45" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">      + 0,005·roll_acel</text><text x="700.0" y="332.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle"></text><text x="700.0" y="350.45" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">giroscopio: rápido</text><text x="700.0" y="367.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">acelerómetro: corrige deriva</text><path d="M220,265 L300,265" fill="none" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0D9488)" opacity="1"/><text x="260" y="255" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">ay, az</text><path d="M220,375 L300,375" fill="none" stroke="#0D9488" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0D9488)" opacity="1"/><text x="260" y="365" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">gx</text><path d="M490,265 L560,265" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><text x="525" y="255" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">roll_acel</text><path d="M490,375 L560,375" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><text x="525" y="365" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">tasa</text><circle cx="930" cy="265" r="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/><text x="930" y="272" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Σ</text><path d="M840,265 L908,265" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><text x="872" y="255" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">roll</text><text x="898" y="292" font-size="18" font-weight="700" fill="#B91C1C" text-anchor="start">−</text><path d="M930,160 L930,243" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><text x="944" y="238" font-size="18" font-weight="700" fill="#15803D" text-anchor="start">+</text><rect x="1011.5" y="237.5" width="140" height="60" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1010" y="235" width="140" height="60" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6" opacity="1"/><text x="1080.0" y="260.45" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="middle">Kp = 0,8</text><text x="1080.0" y="277.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">° alerón / ° error</text><path d="M952,265 L1010,265" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><text x="981" y="255" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">error</text><rect x="1011.5" y="347.5" width="140" height="60" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1010" y="345" width="140" height="60" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6" opacity="1"/><text x="1080.0" y="370.45" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="middle">Kd = 0,05</text><text x="1080.0" y="387.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">° alerón / (°/s)</text><path d="M525,375 L525.0,442.0 Q525,450 533.0,450.0 L1072.0,450.0 Q1080,450 1080.0,442.0 L1080,405" fill="none" stroke="#0F172A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><circle cx="525" cy="375" r="4" fill="#0F172A" stroke="none" stroke-width="1.5"/><text x="800" y="442" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">tasa de alabeo (°/s)</text><rect x="1010" y="168" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4" opacity="1"/><text x="1080" y="195" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="middle">Ki = 0 (apagado)</text><circle cx="1230" cy="320" r="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/><text x="1230" y="327" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Σ</text><path d="M1150,265 L1222.0,265.0 Q1230,265 1230.0,273.0 L1230,298" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><text x="1244" y="292" font-size="18" font-weight="700" fill="#15803D" text-anchor="start">+</text><path d="M1150,375 L1222.0,375.0 Q1230,375 1230.0,367.0 L1230,342" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><text x="1244" y="362" font-size="18" font-weight="700" fill="#B91C1C" text-anchor="start">−</text><rect x="1301.5" y="282.5" width="140" height="80" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1300" y="280" width="140" height="80" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6" opacity="1"/><text x="1370.0" y="306.7" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="middle">Saturación</text><text x="1370.0" y="324.2" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">±25°</text><text x="1370.0" y="341.7" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">LIMITE_ALABEO</text><path d="M1252,320 L1300,320" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><text x="1276" y="310" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">corr</text><rect x="1361.5" y="552.5" width="190" height="100" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1360" y="550" width="190" height="100" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6" opacity="1"/><text x="1455.0" y="586.7" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="middle">Centro</text><text x="1455.0" y="604.2" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">alabeo = 90 + corr</text><text x="1455.0" y="621.7" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">(0–180°, 90 = neutro)</text><path d="M1440,320 L1492.0,320.0 Q1500,320 1500.0,328.0 L1500,550" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><rect x="1061.5" y="542.5" width="240" height="120" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1060" y="540" width="240" height="120" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="1.6" opacity="1"/><text x="1180.0" y="577.95" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Mezclador</text><text x="1180.0" y="595.45" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">izq. = 90 + trim + δ</text><text x="1180.0" y="612.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">der. = 90 + trim − δ</text><text x="1180.0" y="630.45" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">δ = alabeo − 90</text><path d="M1360,600 L1300,600" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><rect x="801.5" y="542.5" width="200" height="120" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="800" y="540" width="200" height="120" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="1.6" opacity="1"/><text x="900.0" y="577.95" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">2 × SG90</text><text x="900.0" y="595.45" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">alerón izq. · GP2</text><text x="900.0" y="612.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">alerón der. · GP3</text><text x="900.0" y="630.45" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">PWM 0,5–2,5 ms</text><path d="M1060,575 L1000,575" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mDB2777)" opacity="1"/><path d="M1060,625 L1000,625" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mDB2777)" opacity="1"/><rect x="501.5" y="542.5" width="230" height="120" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="500" y="540" width="230" height="120" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6" opacity="1"/><text x="615.0" y="577.95" font-size="12.5" font-weight="700" fill="#C2410C" text-anchor="middle">Avión</text><text x="615.0" y="595.45" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">los alerones crean un</text><text x="615.0" y="612.95" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">momento de alabeo</text><text x="615.0" y="630.45" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">→ cambia la inclinación</text><path d="M800,600 L730,600" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F172A)" opacity="1"/><text x="765" y="590" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" font-style="italic">deflexión</text><path d="M500,600 L143.0,600.0 Q135,600 135.0,592.0 L135,392" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#m0F172A)" opacity="1"/><rect x="48" y="720" width="1504" height="92" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" opacity="1"/><text x="68" y="750" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Signo: roll positivo = ala derecha abajo (SENTIDO_IMU = 1). Si el avión corrige al revés, cambiar SENTIDO_IMU o el &quot;sentido&quot; de los alerones en SERVOS_CFG.</text><text x="68" y="774" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Cabeceo y guiñada van en lazo abierto: el valor del piloto pasa directo a los servos (límites ±25° y ±30°). Con ROLL_NEUTRO = False, la casilla 0 pide hasta ±30° de inclinación.</text><text x="68" y="798" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Si el MPU6050 falla al arrancar o da más de 20 errores seguidos en vuelo, los alerones quedan fijos a 90° (sin estabilizar).</text><rect x="848.1953125" y="129.1" width="163.609375" height="37.800000000000004" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" opacity="1"/><text x="930" y="144.43599999999998" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">objetivo = 0°</text><text x="930" y="160.636" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">(ROLL_NEUTRO o failsafe)</text><rect x="236.8671875" y="581.1" width="126.265625" height="37.800000000000004" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" opacity="1"/><text x="300" y="596.436" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">el MPU6050 mide</text><text x="300" y="612.6360000000001" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">la nueva inclinación</text></svg>