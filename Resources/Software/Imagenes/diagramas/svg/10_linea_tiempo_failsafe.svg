<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'DejaVu Sans', sans-serif"><defs></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="48" y="58" font-size="26" font-weight="700" fill="#0F172A">Qué pasa si se corta la red: línea de tiempo del failsafe</text><text x="48" y="86" font-size="15" fill="#475569">Combinación de la retención de tesis1.py (1 s) y el failsafe de main1.py (500 ms)</text><text x="48" y="188" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="start">Laptop → red</text><text x="48" y="208" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">Transmisor1.py</text><line x1="195.5" y1="230" x2="1488.0" y2="230" stroke="#E2E8F0"/><text x="48" y="298" font-size="15" font-weight="700" fill="#C2410C" text-anchor="start">Orange Pi</text><text x="48" y="318" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">tesis1.py</text><line x1="195.5" y1="340" x2="1488.0" y2="340" stroke="#E2E8F0"/><text x="48" y="408" font-size="15" font-weight="700" fill="#0F766E" text-anchor="start">Pico</text><text x="48" y="428" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">main1.py</text><line x1="195.5" y1="450" x2="1488.0" y2="450" stroke="#E2E8F0"/><text x="48" y="543" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Gas del motor</text><text x="48" y="563" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">pulso del ESC</text><line x1="195.5" y1="615" x2="1488.0" y2="615" stroke="#E2E8F0"/><text x="48" y="678" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Superficies</text><text x="48" y="698" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">servos</text><line x1="195.5" y1="720" x2="1488.0" y2="720" stroke="#E2E8F0"/><line x1="219.0" y1="780" x2="1464.5" y2="780" stroke="#0F172A" stroke-width="1.5"/><line x1="242.5" y1="780" x2="242.5" y2="787" stroke="#0F172A" stroke-width="1.5"/><text x="242.5" y="806" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">-0,25 s</text><line x1="360" y1="780" x2="360" y2="787" stroke="#0F172A" stroke-width="1.5"/><text x="360" y="806" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">0,0 s</text><line x1="595.0" y1="780" x2="595.0" y2="787" stroke="#0F172A" stroke-width="1.5"/><text x="595.0" y="806" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">0,5 s</text><line x1="830.0" y1="780" x2="830.0" y2="787" stroke="#0F172A" stroke-width="1.5"/><text x="830.0" y="806" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">1,0 s</text><line x1="1065.0" y1="780" x2="1065.0" y2="787" stroke="#0F172A" stroke-width="1.5"/><text x="1065.0" y="806" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">1,5 s</text><line x1="1300.0" y1="780" x2="1300.0" y2="787" stroke="#0F172A" stroke-width="1.5"/><text x="1300.0" y="806" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">2,0 s</text><text x="1464.5" y="806" font-size="12.5" font-weight="400" fill="#475569" text-anchor="end" font-style="italic">tiempo</text><line x1="360" y1="140" x2="360" y2="780" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="830.0" y1="140" x2="830.0" y2="780" stroke="#C2410C" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="1065.0" y1="140" x2="1065.0" y2="780" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="217.0" y="186" width="4" height="28" rx="2" fill="#6D28D9" stroke="none" stroke-width="1.5" opacity="1"/><rect x="240.5" y="186" width="4" height="28" rx="2" fill="#6D28D9" stroke="none" stroke-width="1.5" opacity="1"/><rect x="264.0" y="186" width="4" height="28" rx="2" fill="#6D28D9" stroke="none" stroke-width="1.5" opacity="1"/><rect x="287.5" y="186" width="4" height="28" rx="2" fill="#6D28D9" stroke="none" stroke-width="1.5" opacity="1"/><rect x="311.0" y="186" width="4" height="28" rx="2" fill="#6D28D9" stroke="none" stroke-width="1.5" opacity="1"/><rect x="334.5" y="186" width="4" height="28" rx="2" fill="#6D28D9" stroke="none" stroke-width="1.5" opacity="1"/><rect x="358.0" y="186" width="4" height="28" rx="2" fill="#6D28D9" stroke="none" stroke-width="1.5" opacity="1"/><text x="289.5" y="234" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">paquete cada 50 ms</text><text x="360" y="208" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="middle">✕</text><rect x="388.2" y="180.0" width="1076.3" height="40" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 4" opacity="1"/><text x="926.35" y="205" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">no llegan paquetes UDP</text><rect x="209.6" y="290.0" width="150.4" height="40" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.2" opacity="1"/><text x="284.8" y="315" font-size="12.5" font-weight="600" fill="#C2410C" text-anchor="middle">recibe y escribe</text><rect x="360" y="290.0" width="470.0" height="40" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.2" opacity="1"/><text x="595.0" y="315" font-size="12.5" font-weight="600" fill="#C2410C" text-anchor="middle">Retención: repite el último comando cada 50 ms (20 ciclos)</text><rect x="382.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="405.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="429.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="452.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="476.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="499.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="523.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="546.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="570.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="593.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="617.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="640.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="664.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="687.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="711.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="734.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="758.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="781.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="805.3" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="828.8" y="332" width="2.4" height="9" rx="1" fill="#C2410C" stroke="none" stroke-width="1.5" opacity="1"/><rect x="830.0" y="290.0" width="634.5" height="40" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 4" opacity="1"/><text x="1147.25" y="315" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">ciclo 21: deja de escribir por I²C</text><rect x="209.6" y="400.0" width="620.4" height="40" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.2" opacity="1"/><text x="519.8" y="425" font-size="12.5" font-weight="600" fill="#0F766E" text-anchor="middle">Normal: recibe escrituras y obedece al piloto</text><rect x="830.0" y="400.0" width="235.0" height="40" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2" opacity="1"/><text x="947.5" y="425" font-size="12.5" font-weight="600" fill="#B45309" text-anchor="middle">cuenta 500 ms</text><rect x="1065.0" y="400.0" width="399.5" height="40" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2" opacity="1"/><text x="1264.75" y="425" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="middle">FAILSAFE activo</text><line x1="209.6" y1="615" x2="1464.5" y2="615" stroke="#94A3B8"/><text x="200.2" y="567.7" font-size="11" font-weight="400" fill="#475569" text-anchor="end">57 %</text><text x="200.2" y="619" font-size="11" font-weight="400" fill="#475569" text-anchor="end">0 %</text><path d="M209.6,615 L209.6,563.7 L1065.0,563.7 L1206.0,615.0 L1464.5,615.0 L1464.5,615 Z" fill="#FEF2F2"/><polyline points="209.6,563.7 1065.0,563.7 1206.0,615.0 1464.5,615.0" fill="none" stroke="#B91C1C" stroke-width="2.6"/><text x="595.0" y="553.7" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">el motor mantiene el último gas recibido</text><rect x="209.6" y="670.0" width="855.4" height="40" rx="8" fill="#F8FAFC" stroke="#334155" stroke-width="1.2" opacity="1"/><text x="637.3" y="695" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Profundidad y timones: último mando del piloto · alerones: PD nivela</text><rect x="1065.0" y="670.0" width="399.5" height="40" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.2" opacity="1"/><text x="1264.75" y="695" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="middle">Profundidad y timones a 90° · PD nivela</text><rect x="1073.0" y="830" width="391.5" height="44" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5" opacity="1"/><text x="1268.75" y="857" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">Resultado: planeo recto sin motor</text><text x="48" y="838" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Recuperación: si vuelve un paquete, la Orange Pi escribe de nuevo y el Pico sale del failsafe en el siguiente ciclo.</text><text x="48" y="860" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Si se cae la Orange Pi (no solo la red), el Pico entra en failsafe 0,5 s después de la última escritura.</text><rect x="289.1875" y="125.2" width="141.625" height="21.6" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" opacity="1"/><text x="360" y="140.536" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">t = 0 s · Se corta la red</text><rect x="739.8125" y="125.2" width="180.375" height="21.6" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" opacity="1"/><text x="830.0" y="140.536" font-size="12" font-weight="700" fill="#C2410C" text-anchor="middle">t = 1,0 s · Última escritura I²C</text><rect x="1003.8515625" y="125.2" width="122.296875" height="21.6" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" opacity="1"/><text x="1065.0" y="140.536" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">t = 1,5 s · FAILSAFE</text><rect x="1199.5" y="560.775" width="115.140625" height="36.45" rx="6" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" opacity="1"/><text x="1205.5" y="575.5845" font-size="11.5" font-weight="600" fill="#B91C1C" text-anchor="start">rampa ≈ 0,3 s</text><text x="1205.5" y="591.1095" font-size="11.5" font-weight="600" fill="#B91C1C" text-anchor="start">57 pasos de 10 µs</text></svg>