<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" font-family="Inter, 'DejaVu Sans', sans-serif"><defs><marker id="m991B1B" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#991B1B"/></marker><marker id="mDC2626" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="48" y="58" font-size="26" font-weight="700" fill="#0F172A">Distribución de energía</text><text x="48" y="86" font-size="15" fill="#475569">Batería 4S 3300 mAh 60C · reguladores separados para potencia, servos y electrónica · masa común en estrella</text><text x="48" y="816" font-size="12" fill="#94A3B8">Elaboración propia a partir del repositorio github.com/prueba2001/UAV-CONTROLADO-POR-4G-LTE</text><rect x="72" y="333" width="250" height="200" rx="14" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.06"/><rect x="70" y="330" width="250" height="200" rx="14" fill="#1F2937" stroke="#111827" stroke-width="1.6" opacity="1"/><rect x="92" y="400" width="44" height="80" rx="6" fill="#374151" stroke="#4B5563" stroke-width="1" opacity="1"/><text x="114" y="446" font-size="13" font-weight="700" fill="#E5E7EB" text-anchor="middle">1S</text><rect x="146" y="400" width="44" height="80" rx="6" fill="#374151" stroke="#4B5563" stroke-width="1" opacity="1"/><text x="168" y="446" font-size="13" font-weight="700" fill="#E5E7EB" text-anchor="middle">2S</text><rect x="200" y="400" width="44" height="80" rx="6" fill="#374151" stroke="#4B5563" stroke-width="1" opacity="1"/><text x="222" y="446" font-size="13" font-weight="700" fill="#E5E7EB" text-anchor="middle">3S</text><rect x="254" y="400" width="44" height="80" rx="6" fill="#374151" stroke="#4B5563" stroke-width="1" opacity="1"/><text x="276" y="446" font-size="13" font-weight="700" fill="#E5E7EB" text-anchor="middle">4S</text><text x="195" y="370" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Batería 4S</text><text x="195" y="508" font-size="12" font-weight="400" fill="#D1D5DB" text-anchor="middle">3300 mAh 60C · 14,8 V (16,8 V cargada)</text><path d="M320,430 L380,430" fill="none" stroke="#991B1B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M380,210 L380,650" fill="none" stroke="#991B1B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M380,250 L470,250" fill="none" stroke="#991B1B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m991B1B)" opacity="1"/><rect x="472" y="188" width="290" height="130" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="470" y="185" width="290" height="130" rx="12" fill="#F8FAFC" stroke="#334155" stroke-width="1.6" opacity="1"/><path d="M471,197 a11,11 0 0 1 11,-11 h266 a11,11 0 0 1 11,11 v4 h-288 z" fill="#334155" opacity="0.9"/><text x="486" y="222" font-size="15" font-weight="700" fill="#334155" text-anchor="start">ESC 40 A</text><text x="486" y="248.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Señal PWM desde GP15</text><text x="486" y="266.625" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">BEC sin usar (rojo desconectado)</text><path d="M380,450 L470,450" fill="none" stroke="#991B1B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m991B1B)" opacity="1"/><rect x="472" y="388" width="290" height="130" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="470" y="385" width="290" height="130" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.6" opacity="1"/><path d="M471,397 a11,11 0 0 1 11,-11 h266 a11,11 0 0 1 11,11 v4 h-288 z" fill="#B91C1C" opacity="0.9"/><text x="486" y="422" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">UBEC 5 V 3 A · servos</text><text x="486" y="448.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Solo los 5 SG90</text><text x="486" y="466.625" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Picos de corriente de hasta 3 A</text><path d="M380,650 L470,650" fill="none" stroke="#991B1B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m991B1B)" opacity="1"/><rect x="472" y="588" width="290" height="130" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="470" y="585" width="290" height="130" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.6" opacity="1"/><path d="M471,597 a11,11 0 0 1 11,-11 h266 a11,11 0 0 1 11,11 v4 h-288 z" fill="#B91C1C" opacity="0.9"/><text x="486" y="622" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="start">UBEC 5 V 5 A · electrónica</text><text x="486" y="648.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Orange Pi, módem LTE y Picos</text><text x="486" y="666.625" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Separado de los servos</text><rect x="902" y="188" width="280" height="130" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="900" y="185" width="280" height="130" rx="12" fill="#F8FAFC" stroke="#334155" stroke-width="1.6" opacity="1"/><path d="M901,197 a11,11 0 0 1 11,-11 h256 a11,11 0 0 1 11,11 v4 h-278 z" fill="#334155" opacity="0.9"/><text x="916" y="222" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Motor brushless</text><text x="916" y="248.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">920 kV · 3 fases (A, B, C)</text><text x="916" y="266.625" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Hélice propulsora</text><path d="M760,232 L900,232" fill="none" stroke="#7C2D12" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M760,250 L900,250" fill="none" stroke="#7C2D12" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M760,268 L900,268" fill="none" stroke="#7C2D12" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><rect x="902" y="378" width="280" height="150" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="900" y="375" width="280" height="150" rx="12" fill="#F8FAFC" stroke="#334155" stroke-width="1.6" opacity="1"/><path d="M901,387 a11,11 0 0 1 11,-11 h256 a11,11 0 0 1 11,11 v4 h-278 z" fill="#334155" opacity="0.9"/><text x="916" y="412" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Riel de servos 5 V</text><text x="916" y="438.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">5 × SG90 (rojo 5 V · marrón GND)</text><text x="916" y="456.625" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Señal naranja desde el Pico</text><text x="916" y="474.75" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">≈ 0,5–1 A en movimiento</text><path d="M760,450 L900,450" fill="none" stroke="#DC2626" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mDC2626)" opacity="1"/><rect x="902" y="583" width="280" height="140" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="900" y="580" width="280" height="140" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6" opacity="1"/><path d="M901,592 a11,11 0 0 1 11,-11 h256 a11,11 0 0 1 11,11 v4 h-278 z" fill="#C2410C" opacity="0.9"/><text x="916" y="617" font-size="15" font-weight="700" fill="#C2410C" text-anchor="start">Orange Pi 4 Pro + Picos</text><text x="916" y="643.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Módem 4G LTE por USB</text><text x="916" y="661.625" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Pico: VSYS por diodo 1N5817</text><path d="M760,650 L900,650" fill="none" stroke="#DC2626" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mDC2626)" opacity="1"/><path d="M195,530 L195.0,752.0 Q195,760 203.0,760.0 L1240,760" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M1180,450 L1232.0,450.0 Q1240,450 1240.0,458.0 L1240,760" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M1180,650 L1212.0,650.0 Q1220,650 1220.0,658.0 L1220,760" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><rect x="1290" y="185" width="260" height="535" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" opacity="1"/><text x="1306" y="214" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">Por qué así</text><text x="1306" y="244.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Los servos generan picos</text><text x="1306" y="263.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">de corriente que pueden</text><text x="1306" y="283.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">reiniciar la Orange Pi o el</text><text x="1306" y="302.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Pico si comparten regulador.</text><text x="1306" y="322.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start"></text><text x="1306" y="341.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Masa común: sin ella, las</text><text x="1306" y="361.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">señales PWM e I²C no tienen</text><text x="1306" y="380.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">referencia y fallan.</text><text x="1306" y="400.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start"></text><text x="1306" y="419.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">El BEC del ESC no se usa:</text><text x="1306" y="439.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">su cable rojo va</text><text x="1306" y="458.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">desconectado.</text><text x="1306" y="478.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start"></text><text x="1306" y="497.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Pendiente: medir la batería</text><text x="1306" y="517.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">con divisor resistivo a</text><text x="1306" y="536.5" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">GP26 (ADC0) del Pico.</text><circle cx="380" cy="430" r="7" fill="#991B1B" stroke="none" stroke-width="1.5"/><rect x="325.8125" y="141.775" width="108.375" height="36.45" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="380" y="156.5845" font-size="11.5" font-weight="700" fill="#991B1B" text-anchor="middle">Bus de batería</text><text x="380" y="172.1095" font-size="11.5" font-weight="700" fill="#991B1B" text-anchor="middle">(conector XT60)</text><rect x="804.4453125" y="211.875" width="51.109375" height="20.25" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="830.0" y="226.158" font-size="11" font-weight="700" fill="#7C2D12" text-anchor="middle">3 fases</text><rect x="815.0703125" y="419.875" width="29.859375" height="20.25" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="830.0" y="434.158" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">5 V</text><rect x="815.0703125" y="619.875" width="29.859375" height="20.25" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="830.0" y="634.158" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">5 V</text><circle cx="1240" cy="760" r="5" fill="#111827" stroke="none" stroke-width="1.5"/><circle cx="1220" cy="760" r="5" fill="#111827" stroke="none" stroke-width="1.5"/><rect x="525.8046875" y="749.2" width="348.390625" height="21.6" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="700" y="764.5360000000001" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">GND común: batería, ESC, UBEC, Pico, servos y Orange Pi</text></svg>