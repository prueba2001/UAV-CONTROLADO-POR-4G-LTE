le">arma &quot;X1,Y1,X2,Y2&quot;</text><rect x="1273.5" y="480.5" width="256" height="64" rx="10" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1272.0" y="478.0" width="256" height="64" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5" opacity="1"/><text x="1400.0" y="505.515" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">socket UDP</text><text x="1400.0" y="522.765" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">→ Orange Pi :5005</text><path d="M1400.0,352 L1400.0,383" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m475569)" opacity="1"/><path d="M1400.0,447 L1400.0,478" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m475569)" opacity="1"/><text x="1400.0" y="580" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="middle">por VPN Tailscale (internet)</text><path d="M1130,530 L1250,530" fill="none" stroke="#64748B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="70" y="715" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="start">Asignación (modo 2):</text><text x="220" y="715" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">A0 = X1 → guiñada (timones)  ·  A1 = Y1 → gas (solo mitad superior)  ·  A2 = X2 → alabeo (alerones)  ·  A3 = Y2 → cabeceo (profundidad)</text><text x="70" y="741" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Los joysticks dan 0–5 V; el ADC del Arduino lo convierte en 0–1023 (centro ≈ 512). La conversión a grados y a % de gas se hace en la Orange Pi.</text><circle cx="758" cy="370" r="3.5" fill="#2563EB" stroke="none" stroke-width="1.5"/><circle cx="758" cy="410" r="3.5" fill="#60A5FA" stroke="none" stroke-width="1.5"/><circle cx="758" cy="450" r="3.5" fill="#2563EB" stroke="none" stroke-width="1.5"/><circle cx="758" cy="490" r="