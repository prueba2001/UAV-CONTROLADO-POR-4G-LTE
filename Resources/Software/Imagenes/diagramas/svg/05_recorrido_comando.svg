<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" font-family="Inter, 'DejaVu Sans', sans-serif"><defs><marker id="m64748B" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#64748B"/></marker><marker id="m7C3AED" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#7C3AED"/></marker><marker id="m0D9488" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#0D9488"/></marker><marker id="mDB2777" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#DB2777"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="48" y="58" font-size="26" font-weight="700" fill="#0F172A">Recorrido de un comando: ejemplo numérico</text><text x="48" y="86" font-size="15" fill="#475569">Qué valor viaja en cada etapa cuando el piloto da 57 % de gas y empuja el stick de cabeceo</text><text x="48" y="766" font-size="12" fill="#94A3B8">Elaboración propia a partir del repositorio github.com/prueba2001/UAV-CONTROLADO-POR-4G-LTE</text><rect x="50" y="133" width="262" height="385" rx="14" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="48" y="130" width="262" height="385" rx="14" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.6" opacity="1"/><path d="M49,143 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v40 h-260 z" fill="#1D4ED8"/><text x="64" y="162" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">1 · Arduino UNO</text><rect x="64" y="194" width="101.8" height="21" rx="10.5" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1" opacity="1"/><text x="114.9" y="207.5" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">Joystick1.ino</text><text x="64" y="252" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Lee el ADC (0–1023)</text><text x="64" y="282" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">X1 = 512</text><text x="64" y="312" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">Y1 = 812</text><text x="64" y="342" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">X2 = 700</text><text x="64" y="372" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">Y2 = 300</text><text x="64" y="416" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Envía por serie:</text><text x="64" y="446" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">&quot;512,812,700,300\n&quot;</text><rect x="362" y="133" width="262" height="385" rx="14" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="360" y="130" width="262" height="385" rx="14" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.6" opacity="1"/><path d="M361,143 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v40 h-260 z" fill="#1D4ED8"/><text x="376" y="162" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">2 · Laptop</text><rect x="376" y="194" width="141.39999999999998" height="21" rx="10.5" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1" opacity="1"/><text x="446.7" y="207.5" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">lector + Transmisor</text><text x="376" y="252" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Comprueba: 4 campos y</text><text x="376" y="282" font-size="13" font-weight="400" fill="#475569" text-anchor="start">todos son números ✓</text><text x="376" y="326" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Payload UDP (15 bytes):</text><text x="376" y="356" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">&quot;512,812,700,300&quot;</text><text x="376" y="400" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Destino:</text><text x="376" y="430" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">IP Tailscale : 5005</text><rect x="674" y="133" width="262" height="385" rx="14" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="672" y="130" width="262" height="385" rx="14" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6" opacity="1"/><path d="M673,143 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v40 h-260 z" fill="#C2410C"/><text x="688" y="162" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">3 · Orange Pi</text><rect x="688" y="194" width="75.4" height="21" rx="10.5" fill="#FFFFFF" stroke="#C2410C" stroke-width="1" opacity="1"/><text x="725.7" y="207.5" font-size="11" font-weight="600" fill="#C2410C" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">tesis1.py</text><text x="688" y="252" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">guiñada = 512/1023·180</text><text x="688" y="282" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">        = 90 (zona ±4)</text><text x="688" y="312" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">gas: 812 &gt; 532 →</text><text x="688" y="342" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">  (812−532)/491·100</text><text x="688" y="372" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">  = 57 %</text><text x="688" y="402" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">alabeo  = 700/1023·180</text><text x="688" y="432" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">        = 123</text><text x="688" y="462" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">cabeceo = 300/1023·180</text><text x="688" y="492" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">        = 53</text><rect x="986" y="133" width="262" height="385" rx="14" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="984" y="130" width="262" height="385" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6" opacity="1"/><path d="M985,143 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v40 h-260 z" fill="#0F766E"/><text x="1000" y="162" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">4 · Pico</text><rect x="1000" y="194" width="68.8" height="21" rx="10.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="1" opacity="1"/><text x="1034.4" y="207.5" font-size="11" font-weight="600" fill="#0F766E" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">main1.py</text><text x="1000" y="252" font-size="13" font-weight="400" fill="#475569" text-anchor="start">alabeo 123 → ignorado</text><text x="1000" y="282" font-size="13" font-weight="400" fill="#475569" text-anchor="start">(ROLL_NEUTRO): el PD</text><text x="1000" y="312" font-size="13" font-weight="400" fill="#475569" text-anchor="start">nivela las alas a 0°</text><text x="1000" y="342" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">cabeceo 53 → 53−90 = −37°</text><text x="1000" y="372" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">  límite ±25° → −25°</text><text x="1000" y="402" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">guiñada 90 → 0°</text><text x="1000" y="432" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">gas 57 % → 1570 µs</text><text x="1000" y="462" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">  rampa: +10 µs/ciclo</text><rect x="1298" y="133" width="262" height="385" rx="14" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1296" y="130" width="262" height="385" rx="14" fill="#F8FAFC" stroke="#334155" stroke-width="1.6" opacity="1"/><path d="M1297,143 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v40 h-260 z" fill="#334155"/><text x="1312" y="162" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">5 · Actuadores</text><rect x="1312" y="194" width="75.4" height="21" rx="10.5" fill="#FFFFFF" stroke="#334155" stroke-width="1" opacity="1"/><text x="1349.7" y="207.5" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">PWM 50 Hz</text><text x="1312" y="252" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">Profundidad: 65°</text><text x="1312" y="282" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">  pulso ≈ 1,22 ms</text><text x="1312" y="312" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">Timones: 90°</text><text x="1312" y="342" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">  pulso ≈ 1,50 ms</text><text x="1312" y="372" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">Alerones: según PD</text><text x="1312" y="402" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">  (izq. +, der. −)</text><text x="1312" y="432" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">ESC: 1570 µs</text><text x="1312" y="462" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">  ≈ 57 % de gas</text><path d="M312,322.5 L358,322.5" fill="none" stroke="#64748B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m64748B)" opacity="1"/><path d="M624,322.5 L670,322.5" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7C3AED)" opacity="1"/><path d="M936,322.5 L982,322.5" fill="none" stroke="#0D9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0D9488)" opacity="1"/><path d="M1248,322.5 L1294,322.5" fill="none" stroke="#DB2777" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mDB2777)" opacity="1"/><text x="48" y="575" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Mapa de memoria I²C del Pico (lo que escribe la Orange Pi en un solo bloque):</text><rect x="48" y="593" width="160" height="92" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.4" opacity="1"/><text x="128" y="617" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="middle">Reg. 0</text><text x="128" y="651" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">123</text><text x="128" y="674" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">alabeo</text><rect x="218" y="593" width="160" height="92" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.4" opacity="1"/><text x="298" y="617" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="middle">Reg. 1</text><text x="298" y="651" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">53</text><text x="298" y="674" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">cabeceo</text><rect x="388" y="593" width="160" height="92" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.4" opacity="1"/><text x="468" y="617" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="middle">Reg. 2</text><text x="468" y="651" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">90</text><text x="468" y="674" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">guiñada</text><rect x="558" y="593" width="160" height="92" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.4" opacity="1"/><text x="638" y="617" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="middle">Reg. 3</text><text x="638" y="651" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">57</text><text x="638" y="674" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">gas %</text><text x="758" y="641" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Cada escritura reinicia el contador de failsafe del Pico (500 ms).</text><text x="758" y="665" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Al iniciar, la memoria vale [90, 90, 90, 0]: todo neutro y motor apagado.</text><text x="758" y="689" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Pulso del servo = 0,5 ms + ángulo/180 × 2 ms   ·   ESC = 1000 + gas × 10 µs</text><text x="758" y="615" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" font-family="'DejaVu Sans Mono', monospace">write_i2c_block_data(0x08, 0x00, [123, 53, 90, 57])</text><rect x="318.6015625" y="270.3" width="32.796875" height="32.400000000000006" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="335.0" y="283.23300000000006" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">USB</text><text x="335.0" y="298.083" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">serie</text><rect x="632.1328125" y="270.3" width="29.734375" height="32.400000000000006" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="647.0" y="283.23300000000006" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">UDP</text><text x="647.0" y="298.083" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">VPN</text><rect x="941.8125" y="270.3" width="34.375" height="32.400000000000006" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="959.0" y="283.23300000000006" font-size="11" font-weight="700" fill="#0D9488" text-anchor="middle">I²C</text><text x="959.0" y="298.083" font-size="11" font-weight="700" fill="#0D9488" text-anchor="middle">0x08</text><rect x="1253.609375" y="277.725" width="34.78125" height="17.55" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="1271.0" y="290.6580000000001" font-size="11" font-weight="700" fill="#DB2777" text-anchor="middle">PWM</text></svg>