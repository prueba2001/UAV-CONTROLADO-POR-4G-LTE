<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" font-family="Inter, 'DejaVu Sans', sans-serif"><defs><marker id="m2563EB" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#2563EB"/></marker><marker id="m64748B" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#64748B"/></marker><marker id="m7C3AED" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#7C3AED"/></marker><marker id="m0D9488" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#0D9488"/></marker><marker id="mDB2777" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.4,5 L0,9.2 z" fill="#DB2777"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="48" y="58" font-size="26" font-weight="700" fill="#0F172A">Arquitectura general del sistema</text><text x="48" y="86" font-size="15" fill="#475569">Del joystick a las superficies de control: estación terrena, red 4G LTE con túnel VPN y aviónica a bordo</text><text x="48" y="966" font-size="12" fill="#94A3B8">Elaboración propia a partir del repositorio github.com/prueba2001/UAV-CONTROLADO-POR-4G-LTE</text><rect x="40" y="112" width="440" height="790" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" opacity="0.55"/><text x="60" y="142" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="1.2">ESTACIÓN TERRENA</text><text x="60" y="162" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Piloto, Arduino y laptop</text><rect x="500" y="112" width="330" height="790" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2" opacity="0.55"/><text x="520" y="142" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="start" letter-spacing="1.2">RED</text><text x="520" y="162" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Internet + red móvil</text><rect x="850" y="112" width="710" height="790" rx="18" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2" opacity="0.55"/><text x="870" y="142" font-size="13" font-weight="700" fill="#C2410C" text-anchor="start" letter-spacing="1.2">A BORDO DEL UAV</text><text x="870" y="162" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Aviónica, actuadores y sensor</text><rect x="72" y="183" width="380" height="150" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="70" y="180" width="380" height="150" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.6" opacity="1"/><path d="M71,192 a11,11 0 0 1 11,-11 h356 a11,11 0 0 1 11,11 v4 h-378 z" fill="#1D4ED8" opacity="0.9"/><text x="86" y="218" font-size="16" font-weight="700" fill="#1D4ED8" text-anchor="start">2 joysticks analógicos</text><text x="86" y="245.0" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Joystick 1 (izq.): X1 guiñada · Y1 gas</text><text x="86" y="263.85" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Joystick 2 (der.): X2 alabeo · Y2 cabeceo</text><text x="86" y="282.7" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Modo 2, como una radio RC</text><rect x="72" y="403" width="380" height="150" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="70" y="400" width="380" height="150" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.6" opacity="1"/><path d="M71,412 a11,11 0 0 1 11,-11 h356 a11,11 0 0 1 11,11 v4 h-378 z" fill="#1D4ED8" opacity="0.9"/><text x="86" y="438" font-size="16" font-weight="700" fill="#1D4ED8" text-anchor="start">Arduino UNO</text><rect x="86" y="446" width="101.8" height="21" rx="10.5" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1" opacity="1"/><text x="136.9" y="459.5" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">Joystick1.ino</text><text x="86" y="489.0" font-size="13" font-weight="400" fill="#475569" text-anchor="start">analogRead() A0–A3 (ADC 10 bits, 0–1023)</text><text x="86" y="507.85" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Envía &quot;X1,Y1,X2,Y2&quot; cada 50 ms (20 Hz)</text><rect x="72" y="623" width="380" height="190" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="70" y="620" width="380" height="190" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.6" opacity="1"/><path d="M71,632 a11,11 0 0 1 11,-11 h356 a11,11 0 0 1 11,11 v4 h-378 z" fill="#1D4ED8" opacity="0.9"/><text x="86" y="658" font-size="16" font-weight="700" fill="#1D4ED8" text-anchor="start">Laptop</text><rect x="86" y="666" width="128.2" height="21" rx="10.5" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1" opacity="1"/><text x="150.1" y="679.5" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">lector_serial1.py</text><rect x="220.2" y="666" width="108.39999999999999" height="21" rx="10.5" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1" opacity="1"/><text x="274.4" y="679.5" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">Transmisor1.py</text><text x="86" y="709.0" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Lee el puerto serie /dev/ttyACM0</text><text x="86" y="727.85" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Valida que lleguen 4 números</text><text x="86" y="746.7" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Envía cada línea por UDP a la IP</text><text x="86" y="765.55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Tailscale de la Orange Pi (puerto 5005)</text><path d="M260,330 L260,400" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m2563EB)" opacity="1"/><path d="M260,550 L260,620" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m64748B)" opacity="1"/><g transform="translate(545,360)"><path d="M60,120 C18,120 10,78 42,66 C38,26 92,12 112,40 C126,6 196,8 196,52 C236,50 244,112 200,120 Z" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.8"/></g><text x="663" y="436" font-size="17" font-weight="700" fill="#6D28D9" text-anchor="middle">Internet</text><text x="663" y="457" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">red móvil 4G LTE</text><text x="665" y="560.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Laptop: Wi-Fi o datos móviles</text><text x="665" y="577.4" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">UAV: SIM 4G en el módem</text><rect x="450" y="719" width="420" height="52" rx="26" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.4" stroke-dasharray="6 5" opacity="1"/><path d="M450,745 L880,745" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7C3AED)" opacity="1"/><rect x="882" y="683" width="300" height="130" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="880" y="680" width="300" height="130" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6" opacity="1"/><path d="M881,692 a11,11 0 0 1 11,-11 h276 a11,11 0 0 1 11,11 v4 h-298 z" fill="#C2410C" opacity="0.9"/><text x="896" y="718" font-size="16" font-weight="700" fill="#C2410C" text-anchor="start">Módem 4G LTE + SIM</text><text x="896" y="745.0" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Da internet a la Orange Pi</text><text x="896" y="763.85" font-size="13" font-weight="400" fill="#475569" text-anchor="start">IP de Tailscale fija (100.x.x.x)</text><rect x="882" y="433" width="300" height="175" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="880" y="430" width="300" height="175" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6" opacity="1"/><path d="M881,442 a11,11 0 0 1 11,-11 h276 a11,11 0 0 1 11,11 v4 h-298 z" fill="#C2410C" opacity="0.9"/><text x="896" y="468" font-size="16" font-weight="700" fill="#C2410C" text-anchor="start">Orange Pi 4 Pro</text><rect x="896" y="476" width="75.4" height="21" rx="10.5" fill="#FFFFFF" stroke="#C2410C" stroke-width="1" opacity="1"/><text x="933.7" y="489.5" font-size="11" font-weight="600" fill="#C2410C" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">tesis1.py</text><text x="896" y="519.0" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Recibe UDP (espera 50 ms)</text><text x="896" y="537.85" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Convierte a grados y % de gas</text><text x="896" y="556.7" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Si se corta la red, repite el</text><text x="896" y="575.55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">último comando durante 1 s</text><rect x="882" y="183" width="300" height="195" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="880" y="180" width="300" height="195" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6" opacity="1"/><path d="M881,192 a11,11 0 0 1 11,-11 h276 a11,11 0 0 1 11,11 v4 h-298 z" fill="#0F766E" opacity="0.9"/><text x="896" y="218" font-size="16" font-weight="700" fill="#0F766E" text-anchor="start">Raspberry Pi Pico</text><rect x="896" y="226" width="68.8" height="21" rx="10.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="1" opacity="1"/><text x="930.4" y="239.5" font-size="11" font-weight="600" fill="#0F766E" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">main1.py</text><text x="896" y="269.0" font-size="13" font-weight="400" fill="#475569" text-anchor="start">MicroPython ≥ 1.26 · esclavo I²C</text><text x="896" y="287.85" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Bucle de control a ~200 Hz</text><text x="896" y="306.7" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Estabiliza el alabeo (PD)</text><text x="896" y="325.55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Failsafe: 500 ms sin datos →</text><text x="896" y="344.4" font-size="13" font-weight="400" fill="#475569" text-anchor="start">motor 0 y planeo nivelado</text><path d="M1030,680 L1030,605" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m64748B)" opacity="1"/><path d="M1030,430 L1030,375" fill="none" stroke="#0D9488" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0D9488)" opacity="1"/><rect x="1252" y="183" width="280" height="150" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1250" y="180" width="280" height="150" rx="12" fill="#F8FAFC" stroke="#334155" stroke-width="1.6" opacity="1"/><path d="M1251,192 a11,11 0 0 1 11,-11 h256 a11,11 0 0 1 11,11 v4 h-278 z" fill="#334155" opacity="0.9"/><text x="1266" y="218" font-size="16" font-weight="700" fill="#334155" text-anchor="start">5 servos SG90</text><text x="1266" y="245.0" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Alerón izq. GP2 · der. GP3</text><text x="1266" y="263.85" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Profundidad GP4</text><text x="1266" y="282.7" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Timón izq. GP5 · der. GP6</text><rect x="1252" y="358" width="280" height="130" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1250" y="355" width="280" height="130" rx="12" fill="#F8FAFC" stroke="#334155" stroke-width="1.6" opacity="1"/><path d="M1251,367 a11,11 0 0 1 11,-11 h256 a11,11 0 0 1 11,11 v4 h-278 z" fill="#334155" opacity="0.9"/><text x="1266" y="393" font-size="16" font-weight="700" fill="#334155" text-anchor="start">ESC 40 A + motor</text><text x="1266" y="420.0" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Brushless 920 kV · batería 4S</text><text x="1266" y="438.85" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Señal PWM 1000–2000 µs (GP15)</text><rect x="1252" y="513" width="280" height="130" rx="12" fill="#0F172A" stroke="none" stroke-width="1.5" opacity="0.05"/><rect x="1250" y="510" width="280" height="130" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6" opacity="1"/><path d="M1251,522 a11,11 0 0 1 11,-11 h256 a11,11 0 0 1 11,11 v4 h-278 z" fill="#B45309" opacity="0.9"/><text x="1266" y="548" font-size="16" font-weight="700" fill="#B45309" text-anchor="start">IMU MPU6050</text><text x="1266" y="575.0" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Acelerómetro + giroscopio</text><text x="1266" y="593.85" font-size="13" font-weight="400" fill="#475569" text-anchor="start">I²C1 400 kHz: GP10 / GP11</text><path d="M1180,240 L1250,240" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mDB2777)" opacity="1"/><path d="M1180,320 L1197.0,320.0 Q1205,320 1205.0,328.0 L1205.0,412.0 Q1205,420 1213.0,420.0 L1250,420" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mDB2777)" opacity="1"/><path d="M1250,575 L1236.0,575.0 Q1228,575 1228.0,567.0 L1228.0,358.0 Q1228,350 1220.0,350.0 L1180,350" fill="none" stroke="#0D9488" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0D9488)" opacity="1"/><rect x="1250" y="670" width="280" height="150" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5" opacity="1"/><text x="1266" y="698" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">Seguridad en dos capas</text><text x="1266" y="722.0" font-size="12" font-weight="400" fill="#475569" text-anchor="start">1. Orange Pi: retiene el último</text><text x="1266" y="739.4" font-size="12" font-weight="400" fill="#475569" text-anchor="start">    comando 1 s (20 × 50 ms)</text><text x="1266" y="756.8" font-size="12" font-weight="400" fill="#475569" text-anchor="start">2. Pico: 500 ms sin I²C →</text><text x="1266" y="774.2" font-size="12" font-weight="400" fill="#475569" text-anchor="start">    motor 0, timones al centro,</text><text x="1266" y="791.6" font-size="12" font-weight="400" fill="#475569" text-anchor="start">    alas niveladas</text><text x="48" y="935" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Enlaces:</text><line x1="118" y1="931" x2="148" y2="931" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><text x="156" y="935" font-size="12" font-weight="400" fill="#475569" text-anchor="start">analógico</text><line x1="241.0" y1="931" x2="271.0" y2="931" stroke="#64748B" stroke-width="3" stroke-linecap="round"/><text x="279.0" y="935" font-size="12" font-weight="400" fill="#475569" text-anchor="start">USB / serie / IP</text><line x1="394.484375" y1="931" x2="424.484375" y2="931" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/><text x="432.484375" y="935" font-size="12" font-weight="400" fill="#475569" text-anchor="start">UDP por VPN</text><line x1="538.5625" y1="931" x2="568.5625" y2="931" stroke="#0D9488" stroke-width="3" stroke-linecap="round"/><text x="576.5625" y="935" font-size="12" font-weight="400" fill="#475569" text-anchor="start">I²C</text><line x1="623.84375" y1="931" x2="653.84375" y2="931" stroke="#DB2777" stroke-width="3" stroke-linecap="round"/><text x="661.84375" y="935" font-size="12" font-weight="400" fill="#475569" text-anchor="start">PWM</text><rect x="183.890625" y="354.2" width="152.21875" height="21.6" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="260" y="369.536" font-size="12" font-weight="500" fill="#2563EB" text-anchor="middle">analógico 0–5 V · A0–A3</text><rect x="167.4921875" y="574.2" width="185.015625" height="21.6" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="260" y="589.5360000000001" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">USB serie · 9600 baud · 20 Hz</text><rect x="539.5390625" y="683.8625" width="250.921875" height="22.275" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="665" y="699.725" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="middle">Túnel VPN Tailscale (WireGuard, cifrado)</text><rect x="542.828125" y="776.1" width="244.34375" height="37.800000000000004" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="665" y="791.436" font-size="12" font-weight="500" fill="#6D28D9" text-anchor="middle">UDP :5005 · texto &quot;X1,Y1,X2,Y2&quot;</text><text x="665" y="807.6360000000001" font-size="12" font-weight="500" fill="#6D28D9" text-anchor="middle">≈ 15 bytes por paquete · 20 por segundo</text><rect x="989.1953125" y="631.2" width="81.609375" height="21.6" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="1030" y="646.5360000000001" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">red IP (USB)</text><rect x="937.0546875" y="391.2" width="185.890625" height="21.6" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="1030" y="406.536" font-size="12" font-weight="500" fill="#0D9488" text-anchor="middle">I²C bus 2 → dir. 0x08 · 4 bytes</text><rect x="1177.8828125" y="210.875" width="74.234375" height="20.25" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="1215" y="225.158" font-size="11" font-weight="500" fill="#DB2777" text-anchor="middle">PWM 50 Hz</text></svg>